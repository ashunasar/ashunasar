name: Waka Readme

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # General
          LOCALE: "en"
          TIME_RANGE: "all_time"
          COMMIT_MESSAGE: "⚡ Update WakaTime stats"

          # Sections
          SHOW_TITLE: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_WEEK_STATS: "True"

          # New AI sections
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"

          # Hide what you don't use
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"

          # Better looking progress bars
          BAR_STYLE: "svg"
          BAR_RADIUS: "6"
          BAR_COLOR: "#58A6FF"
          BAR_TRACK_COLOR: "#21262D"
          TEXT_PRIMARY_COLOR: "#C9D1D9"
          TEXT_SECONDARY_COLOR: "#8B949E"

          DEBUG_LOGGING: "False"
