name: WakaTime README

on:
  workflow_dispatch: # manual trigger: Actions tab -> "WakaTime README" -> Run workflow
  schedule:
    - cron: "17 */12 * * *" # twice a day, off the top of the hour to avoid scheduler congestion

# The action commits the updated README back to this repo.
permissions:
  contents: write

# Never run two updates at once (they would race on the README commit).
concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The action checks out and pushes by itself using GH_TOKEN,
      # so actions/checkout is intentionally not used here.
      - uses: anmol098/waka-readme-stats@master
        with:
          # Secrets - set under Settings > Secrets and variables > Actions
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # classic PAT with `repo` + `user` scopes

          SECTION_NAME: waka # matches <!--START_SECTION:waka--> / <!--END_SECTION:waka-->
          LOCALE: en
          COMMIT_MESSAGE: "chore: update WakaTime stats"

          # Sections
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "False" # exposes private-repo counts, storage etc.
          SHOW_LINES_OF_CODE: "False" # slow; clones every repo
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_UPDATED_DATE: "True"

          # GitHub strips inline <svg> from README markdown, so BAR_STYLE "svg"
          # rendered as broken text. Text bars render everywhere.
          BAR_STYLE: text
          SYMBOL_VERSION: "1"
          DEBUG_LOGGING: "False"
